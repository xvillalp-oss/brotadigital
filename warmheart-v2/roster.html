<head>

<title>Roster — Warm Heart</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Caveat:wght@400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream:  #F4F1E2;
    --brown:  #513229;
    --salmon: #C8825A;
    --salmon-dk: #B3704A;
    --salmon-lt: rgba(200,130,90,0.12);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    min-height: 100vh;
    position: relative;
  }

  /* grain */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
  }

  /* ── NAV ── */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 64px;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    z-index: 90;
    border-bottom: 1px solid rgba(81,50,41,0.08);
  }

  .nav-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.15rem;
    color: var(--brown);
    text-decoration: none;
    letter-spacing: 0.02em;
  }

  .nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
  }

  .nav-links a {
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brown);
    opacity: 0.55;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .nav-links a:hover, .nav-links a.active { opacity: 1; }
  .nav-links a.active { border-bottom: 1.5px solid var(--salmon); padding-bottom: 2px; }

  /* ── PAGE HEADER ── */
  .page-header {
    padding: 110px 40px 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    max-width: 1400px;
    margin: 0 auto 40px;
  }

  .page-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    color: var(--brown);
    letter-spacing: 0.04em;
    position: relative;
  }

  .page-title-sub {
    font-family: 'Caveat', cursive;
    font-size: 1rem;
    color: var(--brown);
    opacity: 0.45;
    display: block;
    margin-top: 4px;
    transform: rotate(-1deg);
  }

  .filter-btn {
    width: 42px;
    height: 42px;
    border: 1.5px solid rgba(81,50,41,0.22);
    border-radius: 50%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--brown);
    transition: border-color 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .filter-btn:hover { border-color: var(--salmon); color: var(--salmon); background: var(--salmon-lt); }

  /* ── CAROUSEL ── */
  .carousel-wrap {
    position: relative;
    padding: 0 40px;
  }

  .carousel-track {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 20px 60px 40px 0;
    scrollbar-width: none;
    cursor: grab;
  }
  .carousel-track::-webkit-scrollbar { display: none; }
  .carousel-track:active { cursor: grabbing; }

  /* ── CREATOR CARD ── */
  .creator-card {
    flex-shrink: 0;
    width: 268px;
    background: transparent;
    scroll-snap-align: start;
    position: relative;
    cursor: pointer;
  }

  .card-photo-wrap {
    position: relative;
    width: 100%;
    height: 360px;
    border-radius: 16px;
    overflow: hidden;
    background: #E8E3D0;
  }

  /* oval variant */
  .creator-card.oval .card-photo-wrap {
    border-radius: 50% / 44%;
    height: 340px;
  }

  .card-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
    transition: transform 0.5s ease;
    filter: contrast(1.02);
  }
  .creator-card:hover .card-photo { transform: scale(1.04); }

  /* location badge */
  .badge-location {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--salmon);
    color: #fff;
    font-family: 'Jost', sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 50px;
    padding: 5px 12px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* platform badges */
  .badges-bottom {
    position: absolute;
    bottom: 14px;
    left: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .badge-platform {
    background: var(--salmon);
    color: #fff;
    font-family: 'Jost', sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    border-radius: 50px;
    padding: 5px 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }

  /* card handle overlay — centered at bottom of oval */
  .badge-handle-center {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--salmon);
    color: #fff;
    font-family: 'Jost', sans-serif;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    border-radius: 50px;
    padding: 6px 18px;
    white-space: nowrap;
  }

  /* ── ARROW BUTTONS ── */
  .carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-60%);
    width: 42px;
    height: 42px;
    border: 1.5px solid rgba(81,50,41,0.25);
    border-radius: 50%;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--brown);
    z-index: 10;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .carousel-arrow:hover { border-color: var(--salmon); color: var(--salmon); background: var(--salmon-lt); transform: translateY(-60%) scale(1.08); }
  .carousel-prev { left: 0; }
  .carousel-next { right: 0; }

  /* ── FOOTER ICONS ── */
  .footer {
    padding: 24px 0 36px;
    display: flex;
    justify-content: center;
    gap: 16px;
  }

  .icon-link {
    width: 38px;
    height: 38px;
    border: 1.5px solid var(--salmon);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--salmon);
    text-decoration: none;
    transition: background 0.2s, transform 0.15s;
  }
  .icon-link:hover { background: var(--salmon-lt); transform: scale(1.08); }

  /* ── FILTER PANEL (hidden by default) ── */
  .filter-panel {
    position: fixed;
    top: 64px;
    right: 0;
    width: 280px;
    height: calc(100vh - 64px);
    background: var(--cream);
    border-left: 1px solid rgba(81,50,41,0.1);
    z-index: 80;
    padding: 32px 24px;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    overflow-y: auto;
  }
  .filter-panel.open { transform: translateX(0); }

  .filter-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    color: var(--brown);
    margin-bottom: 24px;
  }

  .filter-group-label {
    font-family: 'Jost', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brown);
    opacity: 0.45;
    margin-bottom: 12px;
    margin-top: 20px;
  }

  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .filter-chip {
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--brown);
    border: 1.5px solid rgba(81,50,41,0.22);
    border-radius: 50px;
    padding: 6px 16px;
    cursor: pointer;
    background: transparent;
    transition: background 0.2s, border-color 0.2s;
  }
  .filter-chip:hover, .filter-chip.active { background: var(--salmon); border-color: var(--salmon); color: #fff; }

  @media (max-width: 640px) {
    .nav { padding: 0 20px; }
    .page-header { padding: 90px 20px 0; }
    .carousel-wrap { padding: 0 20px; }
    .carousel-arrow { display: none; }
    .creator-card { width: 230px; }
    .card-photo-wrap { height: 300px; }
  }
</style>

<script>
  // Carousel navigation
  const track = document.getElementById('carouselTrack');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const SCROLL = 288;

  prevBtn.addEventListener('click', () => track.scrollBy({ left: -SCROLL, behavior: 'smooth' }));
  nextBtn.addEventListener('click', () => track.scrollBy({ left: SCROLL, behavior: 'smooth' }));

  // Drag to scroll
  let isDown = false, startX, scrollLeft;
  track.addEventListener('mousedown', e => { isDown = true; startX = e.pageX - track.offsetLeft; scrollLeft = track.scrollLeft; });
  track.addEventListener('mouseleave', () => isDown = false);
  track.addEventListener('mouseup', () => isDown = false);
  track.addEventListener('mousemove', e => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - track.offsetLeft;
    track.scrollLeft = scrollLeft - (x - startX) * 1.4;
  });

  // Filter panel toggle
  const filterToggle = document.getElementById('filterToggle');
  const filterPanel = document.getElementById('filterPanel');
  filterToggle.addEventListener('click', () => {
    const open = filterPanel.classList.toggle('open');
    filterToggle.setAttribute('aria-expanded', open);
  });

  // Filter chip toggle
  document.querySelectorAll('.filter-chips').forEach(group => {
    group.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        group.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
      });
    });
  });
</script>
</body>
</html>
